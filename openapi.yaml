openapi: 3.0.3
info:
  title: Network Metrics Producer API
  description: A simple API to publish network performance metrics events to a Kafka topic (fictional demo data).
  version: 1.0.0
servers:
  - url: http://localhost:9090
    description: Development server
paths:
  /publish-metrics:
    post:
      summary: Publish network metrics to Kafka
      description: Accepts network performance metrics for a service and publishes them to the Kafka topic set in TOPIC_NAME.
      requestBody:
        description: Network metrics to be published to Kafka.
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                serviceId:
                  type: string
                  example: "SVC-10045"
                timestamp:
                  type: string
                  format: date-time
                  example: "2026-10-20T09:15:00Z"
                bytesIn:
                  type: integer
                  example: 48213377
                bytesOut:
                  type: integer
                  example: 39117204
                droppedPackets:
                  type: integer
                  example: 12
                fcsErrors:
                  type: integer
                  example: 3
      responses:
        "200":
          description: Message successfully sent to Kafka topic.
        "400":
          description: Invalid request payload.
        "405":
          description: Invalid request method.
        "500":
          description: Internal server error indicating that the message could not be sent to Kafka.
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
